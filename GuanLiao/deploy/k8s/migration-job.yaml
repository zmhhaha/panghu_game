apiVersion: batch/v1
kind: Job
metadata:
  name: guanliao-db-migration
  namespace: guanliao
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: guanliao-db-migration }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: arm-cluster-master:5000/guanliao-server:latest
          imagePullPolicy: Always
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["/bin/sh", "-ec"]
          args:
            - for file in /app/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"; done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: guanliao-database
                  key: url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
