apiVersion: apps/v1
kind: Deployment
metadata:
  name: guanliao-server
  namespace: guanliao
  labels: { app: guanliao-server }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: guanliao-server }
  template:
    metadata:
      # llm-service 的 NetworkPolicy 只放行带此标签的 Pod；缺了是超时，不是 401。
      labels: { app: guanliao-server, llm-client: "true" }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: arm-cluster-master:5000/guanliao-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 4173 }]
          envFrom:
            - configMapRef: { name: guanliao-agent-config }
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4173"
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_BASE_URL }
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_MODEL }
            - name: LLM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_TIMEOUT_MS }
            - name: LLM_MAX_TOKENS
              valueFrom:
                # 可选：默认不设，由上游决定预算（推理模型必须留够思考空间）
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_MAX_TOKENS, optional: true }
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: llm-token, key: LLM_SERVICE_TOKEN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: guanliao-database, key: url }
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guanliao-server
  namespace: guanliao
spec:
  selector: { app: guanliao-server }
  ports: [{ name: http, port: 4173, targetPort: http }]
---
# The shared oauth2-proxy game template always resolves ui.<namespace>:80.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: guanliao
spec:
  selector: { app: guanliao-server }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guanliao-server
  namespace: guanliao
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: guanliao-server }
