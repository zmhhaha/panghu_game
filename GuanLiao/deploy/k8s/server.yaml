apiVersion: apps/v1
kind: Deployment
metadata:
  name: guanliao-server
  namespace: guanliao
  labels: { app: guanliao-server }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: guanliao-server }
  template:
    metadata:
      labels: { app: guanliao-server }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: arm-cluster-master:5000/guanliao-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 4173 }]
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4173"
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: PROVIDER
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: PROVIDER }
            - name: LLM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_TIMEOUT_MS }
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef: { name: guanliao-agent-config, key: LLM_MAX_TOKENS }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: guanliao-database, key: url }
          envFrom:
            - secretRef:
                name: guanliao-agent
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: guanliao-server
  namespace: guanliao
spec:
  selector: { app: guanliao-server }
  ports: [{ name: http, port: 4173, targetPort: http }]
---
# The shared oauth2-proxy game template always resolves ui.<namespace>:80.
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: guanliao
spec:
  selector: { app: guanliao-server }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: guanliao-server
  namespace: guanliao
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: guanliao-server }
