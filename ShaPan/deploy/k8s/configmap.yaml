apiVersion: v1
kind: ConfigMap
metadata:
  name: shapan-config
  namespace: shapan
data:
  NODE_ENV: production
  TRUST_PROXY_AUTH_HEADERS: "true"
  # 模型调用统一走集群内 llm-service；凭据由 llm-token Secret 注入（只给 agent-worker）。
  # LLM_MODEL 是 llm-service 注册的**别名**，不是上游模型名 —— 改回 deepseek-v4-flash 之类会 400。
  # 玩家能下发军令，所以走 guarded 档（禁 tools/response_format，但做不可信内容分隔与 canary 检测）。
  LLM_BASE_URL: http://llm-service.llm.svc.cluster.local/v1
  LLM_MODEL: deepseek-guarded
  LLM_TIMEOUT_MS: "20000"
  SIM_TICK_MS: "5000"
  AGENT_POLL_MS: "2000"
  SSE_POLL_MS: "2000"
