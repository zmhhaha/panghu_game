apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapan-api
  namespace: shapan
  labels: { app: shapan-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shapan-api }
  template:
    metadata:
      labels: { app: shapan-api }
    spec:
      containers:
        - name: api
          image: arm-cluster-master:5000/shapan-api:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: shapan-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shapan-database, key: url } }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shapan-api
  namespace: shapan
spec:
  selector: { app: shapan-api }
  ports: [{ name: http, port: 3001, targetPort: http }]
