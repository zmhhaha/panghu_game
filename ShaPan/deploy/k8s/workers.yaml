apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapan-sim-worker
  namespace: shapan
  labels: { app: shapan-sim-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shapan-sim-worker }
  template:
    metadata:
      labels: { app: shapan-sim-worker }
    spec:
      containers:
        - name: sim
          image: arm-cluster-master:5000/shapan-api:latest
          imagePullPolicy: Always
          command: ["node", "server/src/sim-worker.mjs"]
          envFrom:
            - configMapRef: { name: shapan-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shapan-database, key: url } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shapan-agent-worker
  namespace: shapan
  labels: { app: shapan-agent-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: shapan-agent-worker }
  template:
    metadata:
      labels: { app: shapan-agent-worker }
    spec:
      containers:
        - name: agent
          image: arm-cluster-master:5000/shapan-api:latest
          imagePullPolicy: Always
          command: ["node", "server/src/agent-worker.mjs"]
          envFrom:
            - configMapRef: { name: shapan-config }
            - secretRef: { name: shapan-agent, optional: true }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: shapan-database, key: url } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
