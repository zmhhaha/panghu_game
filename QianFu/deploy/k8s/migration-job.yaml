apiVersion: batch/v1
kind: Job
metadata:
  name: qianfu-db-migration
  namespace: qianfu
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: { app: qianfu-db-migration }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: arm-cluster-master:5000/qianfu-server:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-ec"]
          args:
            - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /app/apps/server/migrations/001_initial.sql
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qianfu-database
                  key: url
