apiVersion: apps/v1
kind: Deployment
metadata:
  name: qianfu-server
  namespace: qianfu
  labels: { app: qianfu-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: qianfu-server }
  template:
    metadata:
      labels: { app: qianfu-server, llm-client: "true" }
    spec:
      containers:
        - name: server
          image: arm-cluster-master:5000/qianfu-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: qianfu-agent-config
                  key: LLM_BASE_URL
                  optional: true
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: qianfu-agent-config
                  key: LLM_MODEL
                  optional: true
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: llm-token, key: LLM_SERVICE_TOKEN }
            - name: LLM_TIMEOUT_MS
              value: "20000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qianfu-database
                  key: url
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: qianfu-server
  namespace: qianfu
spec:
  selector: { app: qianfu-server }
  ports: [{ name: http, port: 3001, targetPort: http }]
