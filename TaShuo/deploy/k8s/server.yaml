apiVersion: apps/v1
kind: Deployment
metadata:
  name: tashuo-server
  namespace: tashuo
  labels: { app: tashuo-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tashuo-server }
  template:
    metadata:
      # llm-service 的 NetworkPolicy 只放行带此标签的 Pod；缺了是超时，不是 401。
      labels: { app: tashuo-server, llm-client: "true" }
    spec:
      containers:
        - name: server
          image: arm-cluster-master:5000/tashuo-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef: { name: tashuo-agent-config, key: LLM_BASE_URL }
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: tashuo-agent-config, key: LLM_MODEL }
            - name: LLM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef: { name: tashuo-agent-config, key: LLM_TIMEOUT_MS }
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: llm-token, key: LLM_SERVICE_TOKEN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-database, key: url }
            # TaShuo 自己的评论确认签名密钥，与模型凭据无关，仍走 tashuo-agent。
            - name: COMMENT_CONFIRMATION_SECRET
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: COMMENT_CONFIRMATION_SECRET }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tashuo-server
  namespace: tashuo
spec:
  selector: { app: tashuo-server }
  ports: [{ name: http, port: 3001, targetPort: http }]
