apiVersion: apps/v1
kind: Deployment
metadata:
  name: tashuo-server
  namespace: tashuo
  labels: { app: tashuo-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tashuo-server }
  template:
    metadata:
      labels: { app: tashuo-server }
    spec:
      containers:
        - name: server
          image: arm-cluster-master:5000/tashuo-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: PROVIDER
              valueFrom:
                configMapKeyRef: { name: tashuo-agent-config, key: PROVIDER }
            - name: LLM_TIMEOUT_MS
              valueFrom:
                configMapKeyRef: { name: tashuo-agent-config, key: LLM_TIMEOUT_MS }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-database, key: url }
            - name: COMMENT_CONFIRMATION_SECRET
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: COMMENT_CONFIRMATION_SECRET }
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: OPENAI_API_KEY, optional: true }
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: OPENAI_BASE_URL, optional: true }
            - name: OPENAI_MODEL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: OPENAI_MODEL, optional: true }
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: DEEPSEEK_API_KEY, optional: true }
            - name: DEEPSEEK_BASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: DEEPSEEK_BASE_URL, optional: true }
            - name: DEEPSEEK_MODEL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: DEEPSEEK_MODEL, optional: true }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: ANTHROPIC_API_KEY, optional: true }
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: ANTHROPIC_BASE_URL, optional: true }
            - name: ANTHROPIC_MODEL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: ANTHROPIC_MODEL, optional: true }
            - name: CUSTOM_API_KEY
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: CUSTOM_API_KEY, optional: true }
            - name: CUSTOM_BASE_URL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: CUSTOM_BASE_URL, optional: true }
            - name: CUSTOM_MODEL
              valueFrom:
                secretKeyRef: { name: tashuo-agent, key: CUSTOM_MODEL, optional: true }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 150m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tashuo-server
  namespace: tashuo
spec:
  selector: { app: tashuo-server }
  ports: [{ name: http, port: 3001, targetPort: http }]

