apiVersion: apps/v1
kind: Deployment
metadata:
  name: tashuo-web
  namespace: tashuo
  labels: { app: tashuo-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tashuo-web }
  template:
    metadata:
      labels: { app: tashuo-web }
    spec:
      containers:
        - name: web
          image: arm-cluster-master:5000/tashuo-web:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tashuo-web
  namespace: tashuo
spec:
  selector: { app: tashuo-web }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: tashuo
spec:
  selector: { app: tashuo-web }
  ports: [{ name: http, port: 80, targetPort: http }]

