apiVersion: apps/v1
kind: Deployment
metadata:
  name: xuye-server
  namespace: xuye
  labels: { app: xuye-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: xuye-server }
  template:
    metadata:
      # llm-service 的 NetworkPolicy 只放行带此标签的 Pod；缺了是超时，不是 401。
      labels: { app: xuye-server, llm-client: "true" }
    spec:
      containers:
        - name: server
          image: arm-cluster-master:5000/xuye-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 4173 }]
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: XUYE_WORKS_FILE
              value: /content/works.json
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef: { name: xuye-agent-config, key: LLM_BASE_URL }
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: xuye-agent-config, key: LLM_MODEL }
            - name: LLM_MAX_TOKENS
              valueFrom:
                configMapKeyRef: { name: xuye-agent-config, key: LLM_MAX_TOKENS }
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: llm-token, key: LLM_SERVICE_TOKEN }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: xuye-database, key: url }
            - name: XUYE_AUTH_REQUIRED
              value: "true"
            - name: XUYE_TRUST_PROXY_AUTH_HEADERS
              value: "true"
          volumeMounts:
            - name: works
              mountPath: /content
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          livenessProbe:
            httpGet: { path: /api/health, port: http }
      volumes:
        - name: works
          configMap:
            name: xuye-works
---
apiVersion: v1
kind: Service
metadata:
  name: xuye-server
  namespace: xuye
spec:
  type: ClusterIP
  selector: { app: xuye-server }
  ports: [{ name: http, port: 4173, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: xuye
  labels: { app: xuye-server, role: web-upstream }
spec:
  type: ClusterIP
  selector: { app: xuye-server }
  ports: [{ name: http, port: 80, targetPort: http }]
