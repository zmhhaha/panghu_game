apiVersion: v1
kind: ConfigMap
metadata:
  name: tewu-agent-config
  namespace: tewu
data:
  # Supported values: openai, deepseek, custom. An LLM provider is required.
  PROVIDER: deepseek
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_MODEL: gpt-4o-mini
  DEEPSEEK_BASE_URL: https://api.deepseek.com
  DEEPSEEK_MODEL: deepseek-v4-flash
  LLM_TIMEOUT_MS: "8000"
