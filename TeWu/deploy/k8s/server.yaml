apiVersion: apps/v1
kind: Deployment
metadata:
  name: tewu-server
  namespace: tewu
  labels: { app: tewu-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: tewu-server }
  template:
    metadata:
      labels: { app: tewu-server, llm-client: "true" }
    spec:
      containers:
        - name: server
          image: arm-cluster-master:5000/tewu-server:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3001 }]
          env:
            - name: LLM_BASE_URL
              valueFrom:
                configMapKeyRef: { name: tewu-agent-config, key: LLM_BASE_URL }
            - name: LLM_MODEL
              valueFrom:
                configMapKeyRef: { name: tewu-agent-config, key: LLM_MODEL }
            - name: LLM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: { name: llm-token, key: LLM_SERVICE_TOKEN }
            - name: LLM_TIMEOUT_MS
              value: "20000"
            - name: TRUST_PROXY_AUTH_HEADERS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tewu-database, key: url }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: tewu-server
  namespace: tewu
spec:
  selector: { app: tewu-server }
  ports: [{ name: http, port: 3001, targetPort: http }]
