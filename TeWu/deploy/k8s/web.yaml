apiVersion: v1
kind: ConfigMap
metadata:
  name: tewu-web-nginx-headers
  namespace: tewu
data:
  # oauth2-proxy 的会话超过 4KB 时会被拆成多个 cookie，浏览器回传的 Cookie 行会超过
  # nginx 默认的 4x8k，导致 400 Request Header Or Cookie Too Large。
  # 2026-10-15 实测：修复前 9KB 单行必 400；修复后 9/16/20/30KB 均 200。
  # 数值与国内 VPS 的 nginx 保持一致（那里修的是同一条链路的上一跳）。
  00-large-headers.conf: |
    client_header_buffer_size   16k;
    large_client_header_buffers 8 32k;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tewu-web
  namespace: tewu
  labels:
    app: tewu-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tewu-web
  template:
    metadata:
      labels:
        app: tewu-web
    spec:
      containers:
        - name: web
          image: arm-cluster-master:5000/tewu-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            # 只覆盖这一个文件名，不动镜像里原有的 conf.d/default.conf
            - name: nginx-headers
              mountPath: /etc/nginx/conf.d/00-large-headers.conf
              subPath: 00-large-headers.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-headers
          configMap:
            name: tewu-web-nginx-headers
---
apiVersion: v1
kind: Service
metadata:
  name: tewu-web
  namespace: tewu
spec:
  selector:
    app: tewu-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: tewu
spec:
  selector:
    app: tewu-web
  ports:
    - name: http
      port: 80
      targetPort: http
