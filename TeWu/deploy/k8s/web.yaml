apiVersion: apps/v1
kind: Deployment
metadata:
  name: tewu-web
  namespace: tewu
  labels:
    app: tewu-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tewu-web
  template:
    metadata:
      labels:
        app: tewu-web
    spec:
      containers:
        - name: web
          image: arm-cluster-master:5000/tewu-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tewu-web
  namespace: tewu
spec:
  selector:
    app: tewu-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: tewu
spec:
  selector:
    app: tewu-web
  ports:
    - name: http
      port: 80
      targetPort: http
