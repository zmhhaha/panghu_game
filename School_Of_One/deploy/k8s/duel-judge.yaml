# ============================================================
#  Duel Judge — 对决裁决 Agent（Python FastAPI）
#  替换了旧的 TypeScript ai-service
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duel-judge
  namespace: school-of-one
  labels:
    app: duel-judge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duel-judge
  template:
    metadata:
      labels:
        app: duel-judge
    spec:
      containers:
        - name: duel-judge
          image: arm-cluster-master:5000/duel-judge:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: agent-config
                optional: true
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secret
                  key: deepseek-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secret
                  key: openai-api-key
                  optional: true
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: duel-judge
  namespace: school-of-one
spec:
  selector:
    app: duel-judge
  ports:
    - port: 8003
      targetPort: 8003
