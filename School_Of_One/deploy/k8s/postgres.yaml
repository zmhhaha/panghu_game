# 删除 postgres.yaml（用你自己集群中已有的 PostgreSQL）
# 你已经有 PostgreSQL 服务在运行，不需要部署这个 StatefulSet。
#
# 你的后端 server 通过环境变量 DATABASE_URL 连接你的 PostgreSQL。
# 请先创建 secret:
#
# kubectl create secret generic db-secret -n school-of-one \
#   --from-literal=url=postgresql://你的用户:你的密码@你的PostgreSQL服务名:5432/school_of_one
#
# 你的 PostgreSQL 需要手动创建数据库:
#   CREATE DATABASE school_of_one;

# 如果你希望把你的 PostgreSQL 信息也写成 secret 备查，参考格式:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: db-secret
#   namespace: school-of-one
# stringData:
#   url: "postgresql://user:password@postgres-service:5432/school_of_one"
# ---
