apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: school-of-one
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arm-cluster-master:5000/school-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: school-of-one
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
