apiVersion: v1
kind: ConfigMap
metadata:
  name: school-of-one-frontend-nginx-headers
  namespace: school-of-one
data:
  # 与 TeWu 那边同一类问题、同一套数值：oauth2-proxy 的会话超过 4KB 时会拆成多个
  # cookie，浏览器回传的 Cookie 行会超过 nginx 默认的 4x8k → 400 Request Header
  # Or Cookie Too Large。该应用的 oauth2-proxy upstream 是 ui.school-of-one.svc:80，
  # 其选择器为 app=frontend，即本 Deployment。
  00-large-headers.conf: |
    client_header_buffer_size   16k;
    large_client_header_buffers 8 32k;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: school-of-one
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: arm-cluster-master:5000/school-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            # 只覆盖这一个文件名，不动镜像里原有的 conf.d/default.conf
            - name: nginx-headers
              mountPath: /etc/nginx/conf.d/00-large-headers.conf
              subPath: 00-large-headers.conf
              readOnly: true
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "500m", memory: "128Mi" }
      volumes:
        - name: nginx-headers
          configMap:
            name: school-of-one-frontend-nginx-headers
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: school-of-one
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
