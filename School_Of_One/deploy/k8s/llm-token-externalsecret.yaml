# ============================================================
#  school-of-one -> llm-service 调用令牌
#
#  三个 judge（duel / combo / training-ground）是同一个项目，共用一个调用方身份，
#  所以只有这一份 Secret、一个 Vault 键。
#
#  只从 secret/llm-service/callers 里取自己那一个键，拿不到别的调用方的令牌；
#  llm-service 由变量名反推身份（LLM_TOKEN_SCHOOL_OF_ONE -> school-of-one）。
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-token
  namespace: school-of-one
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-token
    creationPolicy: Owner
  data:
    - secretKey: LLM_SERVICE_TOKEN
      remoteRef:
        key: secret/data/llm-service/callers
        property: LLM_TOKEN_SCHOOL_OF_ONE
