# =============================================================
# Tunnel Config — School Of One 域名路由规则
# =============================================================
# 使用前修改 hostname 为你的域名
# =============================================================
tunnel: <tunnel-id>
credentials-file: /etc/cloudflared/credentials.json

loglevel: info

ingress:
  # 前端
  - hostname: wulin.yourdomain.com
    service: http://frontend-service.school-of-one.svc.cluster.local:80

  # 后端 API
  - hostname: api.wulin.yourdomain.com
    service: http://server-service.school-of-one.svc.cluster.local:3001

  # 未匹配的流量返回 404
  - service: http_status:404
