# ============================================================
#  Training Ground — API 服务（K8s 部署 - school-of-one 命名空间）
#  部署:
#    kubectl apply -n school-of-one -f k8s/deployment.yaml
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-ground
  namespace: school-of-one
  labels:
    app: training-ground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-ground
  template:
    metadata:
      labels:
        app: training-ground
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/training-ground:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: agent-config
            optional: true
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: url
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: deepseek-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: openai-api-key
              optional: true
        - name: CUSTOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: custom-api-key
              optional: true
        - name: CUSTOM_API_BASE
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: CUSTOM_API_BASE
              optional: true
        - name: CUSTOM_MODEL
          valueFrom:
            configMapKeyRef:
              name: agent-config
              key: CUSTOM_MODEL
              optional: true
        resources:
          requests: { cpu: "200m", memory: "256Mi" }
          limits: { cpu: "2", memory: "2Gi" }
        livenessProbe:
          httpGet:
            path: /api/training/health
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/training/health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: training-ground
  namespace: school-of-one
spec:
  selector:
    app: training-ground
  ports:
  - port: 8005
    targetPort: 8005
