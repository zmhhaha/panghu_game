# ============================================================
#  Training Ground — API 服务（K8s 部署）
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-ground
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-ground
  template:
    metadata:
      labels:
        app: training-ground
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/training-ground:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8005
        envFrom:
        - configMapRef:
            name: training-config
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: training-secret
              key: DEEPSEEK_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: training-secret
              key: OPENAI_API_KEY
              optional: true
        - name: CUSTOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: training-secret
              key: CUSTOM_API_KEY
              optional: true
        - name: CUSTOM_API_BASE
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: CUSTOM_API_BASE
              optional: true
        - name: CUSTOM_MODEL
          valueFrom:
            configMapKeyRef:
              name: training-config
              key: CUSTOM_MODEL
              optional: true
        volumeMounts:
        - name: code
          mountPath: /app/training_ground.py
          subPath: training_ground.py
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api/training/health
            port: 8005
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/training/health
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: training-code
          defaultMode: 0644
---
apiVersion: v1
kind: Service
metadata:
  name: training-ground
  namespace: __NAMESPACE__
spec:
  selector:
    app: training-ground
  ports:
  - port: 80
    targetPort: 8005
