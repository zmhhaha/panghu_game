# ============================================================
#  Duel Judge — API 服务（K8s 部署 - school-of-one 命名空间）
#  模型调用走集群内 llm-service：入口与别名来自 agent-config（envFrom），
#  令牌来自本项目共享的 llm-token Secret。
#  部署:
#    kubectl apply -n school-of-one -f k8s/deployment.yaml
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duel-judge
  namespace: school-of-one
  labels:
    app: duel-judge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duel-judge
  template:
    metadata:
      labels:
        app: duel-judge
        # llm-service 的 NetworkPolicy 只放行带此标签的 Pod；缺了是超时，不是 401
        llm-client: "true"
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/duel-judge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: agent-config
            optional: true
        env:
        # LLM_BASE_URL / LLM_MODEL 由 agent-config 经 envFrom 注入；这里只注入令牌
        - name: LLM_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: llm-token
              key: LLM_SERVICE_TOKEN
        resources:
          requests: { cpu: "50m", memory: "128Mi" }
          limits: { cpu: "2", memory: "2Gi" }
        livenessProbe:
          httpGet:
            path: /api/duel/health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/duel/health
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: duel-judge
  namespace: school-of-one
spec:
  selector:
    app: duel-judge
  ports:
  - port: 8003
    targetPort: 8003
