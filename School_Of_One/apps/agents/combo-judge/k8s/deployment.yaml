# ============================================================
#  Combo Judge — API 服务（K8s 部署）
#  combo_judge.py 通过 ConfigMap 注入
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: combo-judge
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: combo-judge
  template:
    metadata:
      labels:
        app: combo-judge
    spec:
      containers:
      - name: api
        image: arm-cluster-master:5000/combo-judge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        envFrom:
        - configMapRef:
            name: combo-judge-config
        env:
        - name: DEEPSEEK_API_KEY
          valueFrom:
            secretKeyRef:
              name: combo-judge-secret
              key: DEEPSEEK_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: combo-judge-secret
              key: OPENAI_API_KEY
              optional: true
        - name: CUSTOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: combo-judge-secret
              key: CUSTOM_API_KEY
              optional: true
        - name: CUSTOM_API_BASE
          valueFrom:
            configMapKeyRef:
              name: combo-judge-config
              key: CUSTOM_API_BASE
              optional: true
        - name: CUSTOM_MODEL
          valueFrom:
            configMapKeyRef:
              name: combo-judge-config
              key: CUSTOM_MODEL
              optional: true
        volumeMounts:
        - name: code
          mountPath: /app/combo_judge.py
          subPath: combo_judge.py
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /api/combo/health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/combo/health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: combo-judge-code
          defaultMode: 0644
---
apiVersion: v1
kind: Service
metadata:
  name: combo-judge
  namespace: __NAMESPACE__
spec:
  selector:
    app: combo-judge
  ports:
  - port: 80
    targetPort: 8004
