<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武林争霸 · 拳谱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'KaiTi','STKaiti','Noto Serif SC','Source Han Serif SC','Microsoft YaHei',serif;
  background: linear-gradient(180deg, #f2e6c9 0%, #e8d5a3 40%, #dcc29e 70%, #c4a46c 100%);
  color:#2c1810;min-height:100vh;
}
/* 导航 */
.navbar{
  background:linear-gradient(180deg,#f2e6c9,#e8d5a3);border-bottom:1px solid #b8956a;
  padding:6px 20px;display:flex;gap:4px;align-items:center;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 6px rgba(0,0,0,.08);
}
.navbar .logo{font-size:16px;font-weight:bold;letter-spacing:2px;margin-right:12px}
.navbar a{color:#5a3a2a;text-decoration:none;font-size:13px;padding:5px 12px;cursor:pointer;border-radius:2px;transition:all .2s;letter-spacing:1px}
.navbar a:hover,.navbar a.active{background:rgba(139,100,55,.1)}
.page{display:none;max-width:1100px;margin:0 auto;padding:24px}
.page.active{display:block}
.section-title{font-size:20px;letter-spacing:3px;margin-bottom:16px;text-align:center}

/* ===== 拳谱书 ===== */
.bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;padding:20px 0}
.book-spine{
  height:280px;cursor:pointer;position:relative;
  border:1px solid #a08050;
  box-shadow:4px 4px 12px rgba(0,0,0,.15);
  display:flex;flex-direction:column;align-items:center;
  transition:all .2s;text-align:center;padding:20px;
  background-size:contain;background-position:center;background-repeat:no-repeat;
  font-family:'KaiTi','STKaiti','Noto Serif SC',serif;color:#2c1810;
  justify-content:flex-start;padding-top:60px;
}
.book-spine:hover{transform:translateY(-4px);box-shadow:4px 6px 16px rgba(0,0,0,.2)}
.book-spine .icon{font-size:28px;margin-bottom:6px;position:relative;z-index:1;}
.book-spine .title{font-size:16px;font-weight:bold;letter-spacing:3px;text-shadow:0 1px 3px rgba(242,230,201,.6);writing-mode:vertical-rl;position:relative;z-index:1;}
.book-spine .count{font-size:11px;color:#5a3a2a;opacity:.6;position:absolute;bottom:16px;z-index:1;}

/* ===== 拳谱内页 ===== */
.book-page{display:none;max-width:1000px;margin:0 auto;padding:20px}
.book-page.active{display:block}
.book-back{display:inline-block;margin-bottom:16px;padding:6px 16px;border:1px solid #b8956a;cursor:pointer;font-size:13px;letter-spacing:2px;transition:all .2s;color:#5a3a2a}
.book-back:hover{background:rgba(139,100,55,.1)}
.book-header{font-size:22px;font-weight:bold;letter-spacing:4px;margin-bottom:4px}
.book-sub{font-size:13px;color:#5a3a2a;opacity:.7;margin-bottom:16px}
.book-sections{display:flex;flex-direction:column;gap:20px}
.book-section{border:1px solid #b8956a44;padding:16px}
.book-section h3{font-size:16px;letter-spacing:2px;margin-bottom:8px}
.section-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}

/* ===== 古籍拳谱卡牌（底图+覆盖层，无额外边框） ===== */
.card-parchment{
  width:180px;height:255px; /* 底图比例 3:4 */
  position:relative;overflow:hidden;
  cursor:pointer;transition:all .2s;
}
.card-parchment:hover{transform:translateY(-4px);box-shadow:2px 6px 16px rgba(0,0,0,.3)}
/* 底图全铺 */
.card-parchment .bg-img{
  position:absolute;inset:0;z-index:0;
  width:100%;height:100%;object-fit:cover;
  pointer-events:none;
}
.card-parchment .figure-img{
  position:absolute;left:0px;top:60px;z-index:1;
  width: 120px;
  object-fit:contain;
  pointer-events:none;
  opacity:0.88;
}

/* 招式名 */
.card-parchment .move-name{
  position:absolute;top:36px;right:20px;z-index:2;
  writing-mode:vertical-rl;font-size:12px;font-weight:bold;color:#2c1810;letter-spacing:1px;
}
/* 中区：歌诀（每行是一列竖排） */
.card-parchment .main-text{
  position:absolute;top:36px;right:36px;bottom:60px;z-index:2;
  display:flex;flex-direction:row;gap:1px;
  writing-mode:horizontal-tb;
  align-items:flex-start;
}
.card-parchment .main-text .verse-line{
  writing-mode:vertical-rl;text-orientation:mixed;
  font-size:7px;color:#2c1810;letter-spacing:1.5px;line-height:1.5;opacity:.7;
  min-width:1.2em;white-space:nowrap;
}
/* 图说 */
.card-parchment .fig-caption{
  position:absolute;top:40px;left:12px;z-index:2;
  writing-mode:vertical-rl;font-size:7px;color:#2c1810;opacity:.5;letter-spacing:1px;
  border:1px solid #2c181060;padding:2px 4px;
  display:flex;flex-direction:column;gap:0;align-items:center;
}
.card-parchment .fig-caption span{letter-spacing:0.5px;}

/* ===== 演武场（书架模式） ===== */
.deck-bookshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.deck-side{
  background:linear-gradient(135deg,#f2e6c9,#e8d5a3);border:1px solid #b8956a;
  padding:16px;max-height:80vh;overflow-y:auto;min-width:200px;
}
.deck-slot{
  padding:5px 8px;margin-bottom:3px;font-size:12px;font-family:inherit;
  background:rgba(44,24,16,.04);border:1px solid #b8956a33;cursor:pointer;display:flex;justify-content:space-between;color:#2c1810;
}
.deck-slot:hover{background:rgba(44,24,16,.08)}

/* 比武场 */
.arena{
  background:linear-gradient(145deg, #2d2320, #1a1414);
  border:1px solid #4E342E;border-radius:12px;
  padding:24px 60px;margin-bottom:16px;min-height:300px;
  position:relative;overflow:hidden;color:#f5e6c8;
}
/* 地面透视线 — 表示从近到远的距离感 */
.arena-floor{
  position:absolute;bottom:0;left:0;right:0;height:80px;
  background:linear-gradient(180deg, transparent 0%, rgba(60,40,20,0.3) 100%);
  pointer-events:none;
}
/* 地面刻度线 */
.arena-mark{
  position:absolute;bottom:50px;height:1px;background:rgba(90,74,58,0.25);pointer-events:none;
}
.arena-mark-label{
  position:absolute;bottom:56px;font-size:9px;color:rgba(90,74,58,0.4);pointer-events:none;
  transform:translateX(-50%);
}
.arena-layout{position:relative;height:240px;margin-top:40px;z-index:1}
.arena-side{position:absolute;bottom:0;text-align:center;transition:left 0.4s ease,right 0.4s ease}
.arena-side img{height:150px;width:auto;object-fit:contain;display:block;margin:0 auto;opacity:0.9}
/* 回合信息移至顶部 */
.arena-top-info{
  position:absolute;top:8px;left:0;right:0;text-align:center;z-index:2;
}
.arena-ground{position:absolute;bottom:36px;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,#5a4a3a,transparent)}
.arena-dist{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);font-size:12px;color:#8B7D6B;letter-spacing:4px;z-index:2}
.log-box{background:rgba(44,24,16,.03);border:1px solid #b8956a33;padding:12px;max-height:140px;overflow-y:auto;font-size:12px;color:#5a3a2a;font-family:inherit}
.log-item{margin-bottom:3px;opacity:.6}
.log-item.new{opacity:1;color:#2c1810}
.filter-btn{padding:4px 12px;font-size:12px;font-family:inherit;letter-spacing:1px;border:1px solid #b8956a;background:transparent;color:#5a3a2a;cursor:pointer;transition:all .2s}
.filter-btn:hover{background:rgba(139,100,55,.1)}
.filter-btn.active{background:#2c1810;color:#f2e6c9;border-color:#2c1810}
.btn-primary{padding:10px 32px;font-size:14px;font-family:inherit;letter-spacing:2px;border:1px solid #2c1810;background:#2c1810;color:#f2e6c9;cursor:pointer}
.btn-primary:hover{background:#5a3a2a}
</style>
</head>

const ALL_CARDS=[];
FACTIONS.forEach(f=>{f.subs.forEach(sub=>{sub.cards.forEach((n,i)=>{ALL_CARDS.push({id:`${sub.id}-${i}`,factionId:f.id,factionName:f.name,subName:sub.name,name:n,desc:`${n}：${sub.name}之招式，${sub.desc}。`,displacement:i*0.2})})});});
function showPage(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.navbar a').forEach(a=>a.classList.remove('active'));document.getElementById('page-'+n).classList.add('active');document.getElementById('nav-'+n).classList.add('active')}

// ========== 卡牌渲染 ==========
function renderCard(c,oc){
  const v=(VERSES[c.name]||FALLBACK[Math.floor(Math.random()*FALLBACK.length)]).split('\n');
  return`<div class="card-parchment" ${oc?'onclick="'+oc+'"':''}>
    <img class="bg-img" src="assets/card-bg.png" alt="">
    <img class="figure-img" src="assets/picture.png" alt="">
    <div class="fig-caption"><span>圖</span><span>說</span></div>
    <div class="move-name">${c.name}</div>
    <div class="main-text">${v.map(l=>`<div class="verse-line">${l}</div>`).join('')}</div>
  </div>`;
}

// ========== 书架渲染（每个拳种一本拳谱） ==========
function renderBookshelf(containerId, clickHandler){
  const c=document.getElementById(containerId);if(!c)return;
  // 拍平：每个 subStyle 是一本书
  const books=[];
  FACTIONS.forEach(f=>{f.subs.forEach(sub=>{books.push({faction:f,sub:sub})})});
  c.innerHTML=books.map(b=>`<div class="book-spine" onclick="${clickHandler.replace('{subId}',b.sub.id).replace('{factionIcon}',b.faction.icon)}" style="background-image:url(assets/slipcase.png)">
    <div class="title">${b.sub.name}</div>
    <div class="count">${b.faction.name} · ${b.sub.cards.length}式</div>
  </div>`).join('');
}

// ========== 拳谱页（子拳种级别） ==========
(function(){
  const bp=document.getElementById('cards-bookpage');
  renderBookshelf('cards-bookshelf',`showSubBook('{subId}','cards')`);
  window.showSubBook=(subId,page)=>{
    const allSubs=[];FACTIONS.forEach(f=>f.subs.forEach(s=>allSubs.push({faction:f,sub:s})));

  };
  window.hideSubBook=(page)=>{
    document.getElementById(page+'-bookshelf').style.display='grid';
    document.getElementById(page+'-bookpage').classList.remove('active');

// ========== 演武场（书架模式 — 每个拳种一本谱） ==========
let deck=[];let deckSubId=null;
(function(){
  renderBookshelf('deck-bookshelf',`openDeckBook('{subId}')`);
  window.openDeckBook=(subId)=>{
    deckSubId=subId;
    const allSubs=[];FACTIONS.forEach(f=>f.subs.forEach(s=>allSubs.push({faction:f,sub:s})));
    const found=allSubs.find(x=>x.sub.id===subId);if(!found)return;
    const {faction,sub}=found;
    document.getElementById('deck-bookshelf').style.display='none';
    const bp=document.getElementById('deck-bookpage');bp.classList.add('active');
    bp.innerHTML=`<div class="book-back" onclick="closeDeckBook()">← 返回書架</div>
      <div class="book-header">${faction.icon} ${sub.name}</div>
      <div class="book-sub">${faction.name} · ${sub.desc} · ${sub.cards.length}式</div>
      <div class="section-cards">${sub.cards.map((n,i)=>{const c=ALL_CARDS.find(x=>x.id===sub.id+'-'+i);return c?renderCard(c,`toggleDeckCard('${c.id}')`):''}).join('')}</div>`;
    updateDeckUI();
  };
  window.closeDeckBook=()=>{
    document.getElementById('deck-bookshelf').style.display='grid';
    document.getElementById('deck-bookpage').classList.remove('active');
  };
  window.toggleDeckCard=(id)=>{
    const i=deck.indexOf(id);
    if(i>-1)deck.splice(i,1);else if(deck.length<30)deck.push(id);
    updateDeckUI();
  };
  function updateDeckUI(){
    document.getElementById('deck-count').textContent=deck.length;
    const el=document.getElementById('deck-list');
    if(!deck.length){el.innerHTML='<div style="font-size:12px;color:#5a3a2a;opacity:.5;text-align:center;padding:16px;font-family:inherit">從拳譜選招入組</div>';return;}
    el.innerHTML=`<h3 style="font-size:13px;margin-bottom:8px;font-family:inherit">己方卡組</h3>`+
      deck.map(id=>{const c=ALL_CARDS.find(x=>x.id===id);return c?`<div class="deck-slot" onclick="toggleDeckCard('${c.id}')"><span>${c.name}</span><span style="opacity:.5">${c.subName}</span></div>`:''}).join('');
  }
})();

// ========== 比武场 ==========
// 招式小人图
const FIGURE_IMG = 'assets/picture.png';

function figureImg(side){
  const dir = side==='left' ? 'scaleX(1)' : 'scaleX(-1)';
  return `<img src="${FIGURE_IMG}" style="height:200px;width:auto;transform:${dir};object-fit:contain;opacity:0.9">`;
}

// 出牌限制：位移不能超过当前距离
function canPlay(card, dist) { return card.displacement <= dist; }

let duel={hearts:[10,10],distance:2.0,round:0,hand:[],log:[],isFall:false};
function startDuel(){
  document.getElementById('duel-ready').style.display='none';
  document.getElementById('duel-arena').style.display='block';
  duel={hearts:[10,10],distance:2.0,round:0,hand:[],log:['比武開始！雙方相距 2米'],isFall:false};
  duel.hand=ALL_CARDS.sort(()=>Math.random()-.5).slice(0,5);
  ud();
}
function plc(id){
  const c=ALL_CARDS.find(x=>x.id===id); if(!c) return;
  // 出牌限制检查
  if(!canPlay(c, duel.distance)) return;
  const ai=ALL_CARDS[Math.floor(Math.random()*ALL_CARDS.length)];
  const rawDist=duel.distance-c.displacement-(ai.displacement||0);

  let newDist, isFall=false;
  if(rawDist<0){ newDist=0; isFall=true; }
  else newDist=rawDist;

  const hit=Math.random()>0.4?1:0, aiHit=Math.random()>0.5?1:0;
  duel.hearts[1]=Math.max(0,duel.hearts[1]-hit);
  duel.hearts[0]=Math.max(0,duel.hearts[0]-aiHit);
  const fallMsg=isFall?'雙方相撞摔倒在地！':'';
  const hitMsg=hit&&aiHit?'互相命中！':hit?'命中！':aiHit?'被命中！':'未命中';
  duel.log.unshift(`${duel.round+1}回：你出「${c.name}」(位移+${c.displacement})，對手出「${ai.name}」。距${duel.distance.toFixed(1)}→${newDist.toFixed(1)}m。${hitMsg}${fallMsg}`);
  duel.distance=newDist; duel.round++; duel.isFall=isFall;
  ud();
  if(duel.hearts[0]<=0)setTimeout(()=>alert('你戰敗了！'),500);
  if(duel.hearts[1]<=0)setTimeout(()=>alert('你獲勝了！'),500);
}
function ud(){
  const p=duel;
  document.getElementById('player-hearts').innerHTML=renderHearts(p.hearts[0]);
  document.getElementById('ai-hearts').innerHTML=renderHearts(p.hearts[1]);
  document.getElementById('round-display').innerHTML='⚔️ 第 '+p.round+' 回合';
  document.getElementById('distance-display').textContent='相距 '+p.distance.toFixed(1)+'m';
  document.getElementById('player-figure').innerHTML=figureImg('left');
  document.getElementById('ai-figure').innerHTML=figureImg('right');
  // 距离映射：distance 0~2.5m → 靠拢 0%~20%，2.5~5m → 固定在两端
  const pct = Math.min(p.distance / 2.5 * 20, 20);
  document.getElementById('player-side').style.left = (5 - pct/2) + '%';
  document.getElementById('player-side').style.right = 'auto';
  document.getElementById('ai-side').style.right = (5 - pct/2) + '%';
  document.getElementById('ai-side').style.left = 'auto';
  // 摔倒时对位叠在一起
  if(p.isFall) {
    document.getElementById('player-side').style.left = '35%';
    document.getElementById('player-side').style.right = 'auto';
    document.getElementById('ai-side').style.right = '35%';
    document.getElementById('ai-side').style.left = 'auto';
  }
  // 手牌（灰显不可出的牌）
  document.getElementById('hand-container').innerHTML=p.hand.map(c=>`<div onclick="plc('${c.id}')" style="cursor:pointer;opacity:${canPlay(c,p.distance)?1:0.35}">${renderCard(c)}<div style="font-size:11px;color:#8B7D6B;margin-top:4px;text-align:center">📍${c.displacement>=0?'+':''}${c.displacement}m</div></div>`).join('');
  document.getElementById('log-container').innerHTML='<div style="font-size:12px;color:#8B7D6B;margin-bottom:8px">戰況記錄</div>'+p.log.map((m,i)=>`<div class="log-item ${i?'':'new'}">${m}</div>`).join('');
  // 摔倒后重置距离
  if(p.isFall){ setTimeout(()=>{ p.distance=1.0; p.isFall=false; ud(); }, 2000); }
}
// 血量显示：上下两排，每行最多 5 颗
function renderHearts(n){
  var r1=n>5?'❤️'.repeat(5):'❤️'.repeat(n);
  r1+=n>5?'':'🖤'.repeat(5-n);
  var r2='';
  if(n>5){ r2='❤️'.repeat(n-5)+'🖤'.repeat(10-n); }
  return r1+(r2?'<br>'+r2:'');
}
